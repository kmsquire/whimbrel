# One workflow for three jobs:
#   build    every pull request, push and v* tag: fmt, clippy and tests for each target that ships,
#            then the release build, its proofs (scripts/prove) and its packages (scripts/package).
#            Read-only: nothing it runs can mint a token.
#   secret-patterns
#            every pull request, push and v* tag: the generated built-in secret patterns are what
#            tools/secret-patterns writes from its pinned lists. Read-only.
#   publish  v* tags only, after both: checks the tagged commit is already on main and the tag is
#            the version every package's BUILDINFO names, attests the packages and publishes the
#            release. It's the only job with write or
#            OIDC permissions, and it builds nothing: no checkout, no toolchain.
name: CI

on:
  push:
    branches: [main]
    tags: ["v[0-9]*"]
  pull_request:

permissions:
  contents: read

env:
  CARGO_INCREMENTAL: "0"
  CARGO_TERM_COLOR: always
  # macOS 13 (Ventura) or later, on Apple silicon or Intel.
  MACOSX_DEPLOYMENT_TARGET: "13.0"
  # The binary stamps this into --version, and scripts/prove requires it.
  WHIMBREL_COMMIT: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  build:
    name: build (${{ matrix.target }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-unknown-linux-musl
            os: ubuntu-24.04
          - target: aarch64-apple-darwin
            os: macos-15
          # Built on an Apple-silicon runner too, since GitHub is retiring its Intel ones. Its
          # tests and proofs run the x86_64 binaries under Rosetta.
          - target: x86_64-apple-darwin
            os: macos-15
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.WHIMBREL_COMMIT }}
      - name: Rosetta
        if: runner.os == 'macOS'
        run: arch -x86_64 /usr/bin/true 2>/dev/null || softwareupdate --install-rosetta --agree-to-license
      - name: Toolchain, from rust-toolchain.toml
        run: rustup toolchain install
      - name: shellcheck
        if: runner.os == 'Linux'
        run: shellcheck scripts/*
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets --locked --target ${{ matrix.target }} -- -D warnings
      - run: cargo test --locked --target ${{ matrix.target }}
      # The command check's tests that need root: the privilege drop and the ownership refusal.
      # Run from the test binary cargo just built, so sudo needs no toolchain, and the count is
      # checked so a filter that matches nothing can't pass.
      - name: As root
        run: |
          set -euo pipefail
          bin=$(cargo test --locked --target ${{ matrix.target }} --test command --no-run --message-format=json \
            | jq -r 'select(.profile.test == true and .target.name == "command") | .executable')
          sudo "$bin" --ignored --test-threads=1 | tee root-tests.out
          grep -q '^test result: ok. 4 passed' root-tests.out
      - run: cargo build --release --locked --target ${{ matrix.target }}
      - run: scripts/prove ${{ matrix.target }}
      - run: scripts/package ${{ matrix.target }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist-${{ matrix.target }}
          path: dist/
          if-no-files-found: error

  # The built-in secret patterns are generated by tools/secret-patterns from the lists it pins.
  # This regenerates every generated file and fails on any difference, so none is edited by hand.
  # It fetches the pinned files from GitHub, so it needs the network.
  secret-patterns:
    name: built-in secret patterns
    runs-on: ubuntu-24.04
    # Each fetch gives up after three tries of a minute each, so a stalled one can't hold the job.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: tools/secret-patterns
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.WHIMBREL_COMMIT }}
      # rust-toolchain.toml's compiler, without the four targets it names for the binary that
      # ships: the tool runs here only.
      - name: Toolchain, the channel from rust-toolchain.toml
        run: |
          set -euo pipefail
          channel=$(sed -n 's/^channel = "\(.*\)"$/\1/p' ../../rust-toolchain.toml)
          rustup toolchain install "$channel" --profile minimal --component rustfmt,clippy
          echo "RUSTUP_TOOLCHAIN=$channel" >> "$GITHUB_ENV"
      - run: cargo fmt -- --check
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
      - run: cargo run --locked -- check

  publish:
    # Never while the repo is private: provenance can't be attested there, and nothing should be
    # released before the repo is public.
    if: startsWith(github.ref, 'refs/tags/v') && !github.event.repository.private
    # Never a release whose generated secret patterns aren't what the tool writes.
    needs: [build, secret-patterns]
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      # A tag on a commit that never reached main would publish code nobody reviewed, and
      # `--source-ref refs/tags/<tag>` would still verify it. So the commit must already be on main:
      # the compare is `identical` (it is main) or `behind` (main has moved past it). Anything else,
      # an API error included, stops here.
      - name: The tagged commit is on main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          st=$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$GITHUB_SHA" --jq .status) \
            || { echo "::error::couldn't compare $GITHUB_SHA with main"; exit 1; }
          case $st in
            identical | behind) echo "$GITHUB_SHA is on main ($st)" ;;
            *) echo "::error::tag $GITHUB_REF_NAME is on $GITHUB_SHA, which isn't on main ($st)"; exit 1 ;;
          esac
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: dist-*
          merge-multiple: true
          path: dist
      - name: The tag is the version every package was built as
        run: |
          set -euo pipefail
          want=${GITHUB_REF_NAME#v}
          found=0
          for f in dist/*.BUILDINFO; do
            got=$(awk '$1 == "version" { print $2 }' "$f")
            [[ $got == "$want" ]] || { echo "::error::tag $GITHUB_REF_NAME, but $f says version '$got'"; exit 1; }
            found=$((found + 1))
          done
          [[ $found == 4 ]] || { echo "::error::expected 4 BUILDINFO files, found $found"; exit 1; }
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: "dist/*.tar.gz, dist/*.BUILDINFO"
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --title "$GITHUB_REF_NAME" --notes "Built from $GITHUB_SHA.

          Verify a file against this release's tag, not just the repo:

              gh attestation verify <file> --repo $GITHUB_REPOSITORY \\
                --signer-workflow $GITHUB_REPOSITORY/.github/workflows/ci.yml \\
                --source-ref refs/tags/$GITHUB_REF_NAME"
