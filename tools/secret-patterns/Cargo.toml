[package]
name = "secret-patterns"
description = "Generates whimbrel's built-in secret patterns from the lists they're taken from."
version = "0.0.0"
edition = "2024"
license = "MIT OR Apache-2.0"
publish = false

[dependencies]
regex = "1"
regex-syntax = "0.8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
toml = "0.9"
ureq = "3"

# Selection compiles every rule of the lists, some of them large: unoptimized, that takes minutes.
[profile.dev.package.regex-automata]
opt-level = 3

[profile.dev.package.regex-syntax]
opt-level = 3

# Its own root and its own lock file: nothing here reaches the binary whimbrel ships.
[workspace]
